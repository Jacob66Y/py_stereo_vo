dataset:
  root: "~/datasets/kitti_odometry"
  sequence: "00"
  input_mode: "rgb"

tracker:
  max_frames: 500
  max_corners: 2000
  quality_level: 0.01
  min_distance: 10
  block_size: 7
  lk_win_size: 21
  lk_max_level: 3
  lk_max_error: 20.0

stereo:
  min_disparity: 0
  num_disparities: 128
  block_size: 7
  min_depth: 0.5
  max_depth: 60.0
  min_valid_disparity: 1.0

pnp:
  min_points: 20
  reprojection_error: 3.0
  confidence: 0.999
  iterations: 100

keyframe:
  min_tracked_landmarks: 120
  translation_thresh: 0.25
  rotation_thresh_deg: 7.0
  frame_gap: 5
  new_feature_mask_radius: 12
  max_new_landmarks: 1200

output:
  save_dir: "outputs"
  save_keyframes: true
  save_trajectory: true
  show_plot: true
